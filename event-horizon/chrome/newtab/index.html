<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<header>
  <p id="greet" class="kicker"></p>
  <h1 id="time">00:00</h1>
  <p id="date" class="kicker"></p>
</header>
<section class="dock">
  <form id="search" autocomplete="off">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
    <input id="q" type="search" placeholder="Search past the horizon" aria-label="Search the web" autofocus>
  </form>
  <nav id="sites" aria-label="Most visited"></nav>
</section>
<script src="app.js"></script>
</body>
</html>
